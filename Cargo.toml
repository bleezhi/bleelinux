[workspace]
resolver = "2"
members = [
    "crates/bleepkg",
    "crates/bleepm",
    "crates/bleepinit",
    "crates/bleesh",
    "crates/bleepbuild",
    "crates/bleepconfig",
    "crates/bleepiso",
    "crates/bleeprepo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Bleelinux Contributors"]
repository = "https://github.com/bleez/bleelinux"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.38", features = ["full"] }
nix = { version = "0.27", features = ["fs", "mount", "signal", "process", "user", "sched", "term", "hostname", "reboot"] }
zstd = "0.13"
minisign = "0.4"
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite"] }
walkdir = "2.5"
tempfile = "3.8"
sha2 = "0.10"
blake3 = "1.5"
url = "2.5"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "blocking", "stream"] }
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
bzip2 = "0.4"
crc32fast = "1.3"
uuid = { version = "1.7", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1.0", features = ["serde"] }
glob = "0.3"
which = "6.0"
ctrlc = "3.4"
signal-hook = "0.3"
signal-hook-tokio = "0.3"
caps = "0.5"
libmount = "0.1"
whoami = "1.5"
num_cpus = "1.16"
zip = "2.1"
dirs = "5.0"
libc = "0.2"
indicatif = "0.17"
console = "0.15"
futures = "0.3"
rustyline = "15"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
debug = true
